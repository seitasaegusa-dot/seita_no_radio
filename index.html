<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>晴太のらぢお｜Kodo Heartbeat Radio</title>
<style>
  :root{--bg:#0d0d0e;--ink:#fff;--sub:#b0aea8;--red:#c1272d;--line:#3a3a3c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
       line-height:1.8;display:flex;justify-content:center;padding:6vw 5vw}
  main{width:100%;max-width:560px}
  img{width:100%;border-radius:12px;display:block}
  h1{font-size:1.6rem;margin:1.6rem 0 .3rem;letter-spacing:.02em}
  .sub{color:var(--sub);font-size:.9rem;margin:0 0 1.6rem}
  p{color:var(--sub);font-size:.95rem}
  a.btn{display:block;text-align:center;text-decoration:none;color:var(--ink);
        border:1px solid var(--line);border-radius:10px;padding:.9rem;margin:.6rem 0;
        font-weight:600}
  a.btn:hover{border-color:var(--red);color:var(--red)}
  hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
  small{color:var(--sub);font-size:.8rem}
</style>
<main>
  <img src="cover.jpg" alt="晴太のらぢお">
  <h1>晴太のらぢお</h1>
  <p class="sub">Kodo Heartbeat Radio ／ 毎週木曜20時</p>
  <p>太鼓芸能集団「鼓童」の三枝晴太が、太鼓のことだけを話す番組です。プロの打ち手が普段どう考えているのか。稽古場で何が起きているのか。全国の太鼓打ちが、なぜあそこまで打ち込むのか。</p>
  <a class="btn" href="https://www.instagram.com/seita_no_radio/">Instagram で切り抜きを見る</a>
  <a class="btn" href="feed.xml">RSS</a>
  <hr>
  <small>出演：三枝晴太（鼓童）／ お便り・出演希望は Instagram のDMまで</small>
</main>

name: 住所録を更新する

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: feed.xml を作り直す
        run: python3 generate_feed.py

      - name: 変化があれば保存する
        run: |
          if [ -n "$(git status --porcelain feed.xml)" ]; then
            git config user.name  "feed-bot"
            git config user.email "actions@github.com"
            git add feed.xml
            git commit -m "feed.xml を更新"
            git push
            echo "更新しました"
          else
            echo "変化なし"
          fi

